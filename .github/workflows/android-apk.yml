name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de demonstracao
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      # Sem as duas variaveis, o APK funciona com dados locais.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Validar configuracao do Supabase
        shell: bash
        run: |
          if [[ -n "$EXPO_PUBLIC_SUPABASE_URL" && -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]] || [[ -z "$EXPO_PUBLIC_SUPABASE_URL" && -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]]; then
            echo 'Configure as duas Repository variables do Supabase ou deixe ambas vazias.'
            exit 1
          fi
          if [[ -n "$EXPO_PUBLIC_SUPABASE_URL" ]]; then
            echo 'APK configurado para Supabase.'
          else
            echo 'APK configurado para demonstracao local.'
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir tipos e regras de negocio
        run: |
          npm run typecheck
          npm test

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK com JavaScript incorporado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Preparar e validar APK
        shell: bash
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/next-chapter.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify apk/next-chapter.apk
          sha256sum apk/next-chapter.apk > apk/SHA256SUMS.txt
          echo '## APK Next Chapter' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe o artifact next-chapter-android-apk abaixo e extraia next-chapter.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build release para demonstracao, usando a assinatura de desenvolvimento do template Expo. Nao requer Expo Go nem servidor Metro.' >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: next-chapter-android-apk
          path: apk/
          if-no-files-found: error
          retention-days: 30
